apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jev-guardrail
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jev-guardrail
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
